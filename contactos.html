<!DOCTYPE html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8"/>
        <meta name="description" content="Entre em contacto com Vanessa Moreira para proposta de estágio, projeto de desenvolvimento web ou esclarecimento de dúvidas."/>
        <meta name="author" content="Vanessa Moreira"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Portfolio | Contactos</title>
        
    </head>

    <body>
        <header>
            <h1>Contactos</h1>

            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="contactos.html">Contactos</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="formulario-contacto">
                <!--Formulario de Contacto-->
                <h2>Envie uma mensagem</h2>
                <p>Se preferir, pode enviar uma mensagem diretamente através do formulário abaixo:</p>

                <form action="#" mathod="post">
                    <fieldset>
                        <legend>Informações Pessoais</legend>

                        <div>
                            <label for="nome">Nome</label> <br/>
                            <input 
                               type="text"
                               name="nome"
                               id="nome"
                               placeholder="Insira o seu nome"
                               required
                               />
                        </div> <br/>

                        <div>
                            <label for="email">Email</label><br/>
                            <input
                               type="email"
                               name="email"
                               id="email"
                               placeholder="Insira o teu email"
                               required
                               />
                               
                        </div> <br/>

                        <div>
                            <label for="telefone">Telefone</label> <br/>
                            <input
                               type="tel"
                               name="telefone"
                               id="telefone"
                               placeholder="(+238) 000 00 00"
                               />
                        </div> <br/>
                    </fieldset>

                    <fieldset>
                        <legend>Motivos de Contactos</legend>
                        <div>
                            <label for="assunto">Assunto:</label> <br/>
                            <select required>
                                <option value="">-- Selecione uma opção --</option>
                                <option value="Proposta de estagio">Proposta de Estagio</option>
                                <option value="Projetos ou colaboracoes">Projetos ou colaboracoes</option>
                                <option value="Duvidas ou esclarecimento">Duvidas ou Esclarecimentos</option>
                                
                            </select>
                        </div> <br/>

                        <div>
                            <label for="mensagem">Mensagem</label> <br/>
                            <textarea 
                                id="mensagem" 
                                name="mensagem" 
                                placeholder="Sua mensagem" 
                                rows="10" 
                                cols="20" 
                                required
                                maxlength="255"></textarea>
                        </div> <br/>

                        <div>
                            <label for="resposta">Como preferes receber a resposta?</label> <br/>
                            <input
                               type="radio"
                               id="telefone"
                               name="resposta"
                               value="telefone"
                               checked
                               />
                            <label for="telefone">Telefone</label> 

                            <input
                               type="radio"
                               id="email"
                               name="resposta"
                               value="email"/>
                            <label for="email">Email</label> 
                        </div> <br/>

                        <div>
                            <label for="autorizacao">Autorização</label>
                            <input
                               type="checkbox"
                               id="autorizacao"
                               name="autorizacao"
                               required/>
                            <label>Autoriza a utilização dos meus dados e aceito os termos de uso da plataforma!</label>
                        </div>
                    </fieldset>

                    <div>
                        <button type="submit">Enviar mensagem</button>
                        <button type="reset">Limpar formulário</button>
                    </div>

                </form>
            </section>
        </main>

    </body>
</html>
