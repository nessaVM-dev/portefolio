<!DOCTYPE html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8"/>
        <meta name="description" content="Entre em contacto com Vanessa Moreira para proposta de estágio, projeto de desenvolvimento web ou esclarecimento de dúvidas."/>
        <meta name="author" content="Vanessa Moreira"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Portfolio | Contactos</title>
        
    </head>

    <body>
        <header>
            <h1>Contactos</h1>

            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="contactos.html">Contactos</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="formulario-contacto">
                <!--Formulario de Contacto-->
                <h2>Envie uma mensagem</h2>
                <p>Se preferir, pode enviar uma mensagem diretamente através do formulário abaixo:</p>

                <form action="#" method="GET">
                    <label for="nomecompleto">Nome Completo</label> <br/>
                    <input 
                        type="text" 
                        placeholder="Insira o seu nome completo"
                        id="nomecompleto" 
                        name="nomecompleto"/> <br/>
                    <label for="datadenascimento">Data de Nascimento</label> <br/>
                    <input 
                        type="date" 
                        id="datadenascimento"  
                        name="datadenascimento"/> <br/>
                    <label for="password">Password</label> <br/>
                    <input 
                        type="password" 
                        placeholder="Insira a sua palavra passe"
                        id="password"  
                        name="password"/> <br/>

                    <select>
                        <option value="m">Masculino</option>
                        <option valeu="f">Feminino</option>
                    </select> <br/>

                    <textarea
                        id="descricao"
                        name="descricao"
                        placeholder="Escreva a tua mensagem"
                        rows="6"
                        cols="40"
                    >
                    </textarea> <br/>

                    <label for="telefone">Telefone</label>
                    <input 
                        type="radio"
                        id="telefone"
                        name="preferencia"
                        checked/>
                    <label for="Email">Email</label>
                    <input
                        type="radio"
                        id="email"
                        name="preferencia"/> <br/>

                    <label for="autorizacao">Autorização para uso dos dados introduzidos</label>
                    <input
                        type="checkbox"
                        id="autorizacao"
                        name="autorizacao"/>

                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>


                </form>

            </section>
        </main>

    </body>
</html>
